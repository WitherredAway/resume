name: Refresh stats

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 stats.py

      - name: Rebuild
        run: |
          typst compile --font-path fonts main.typ
          typst compile --font-path fonts --format png --ppi 150 main.typ "preview-{n}.png"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json main.pdf preview-1.png
          git diff --quiet --cached || git commit -m "Refresh stats"
          git push
